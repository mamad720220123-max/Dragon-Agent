name: Build & Release Dragon Agent APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Ready-to-Install APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Secrets & Environment Files
        run: |
          # 1. Ensure .env exists
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Ensure app/google-services.json exists
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dragon-agent-app",
              "storage_bucket": "dragon-agent-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                  "android_client_info": {
                    "package_name": "com.aistudio.dragonstudio.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildValidationOnly12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 3. Ensure debug.keystore exists and is valid
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating brand-new debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Android APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package & Verify APK Output
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-output/Dragon-Agent-v1.0-Beta.apk
            echo "APK successfully built: $(ls -lh release-output/Dragon-Agent-v1.0-Beta.apk)"
            sha256sum release-output/Dragon-Agent-v1.0-Beta.apk > release-output/SHA256SUMS.txt
          else
            echo "Error: No APK found after assembleDebug"
            exit 1
          fi

      - name: Upload APK to Artifacts (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Agent-v1.0-Beta-APK
          path: release-output/
          retention-days: 90

      - name: Create GitHub Release (On Version Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-output/Dragon-Agent-v1.0-Beta.apk
            release-output/SHA256SUMS.txt
          name: "Dragon Agent ${{ github.ref_name }} (Beta)"
          body: |
            ### 🐉 Dragon Agent Android App (Beta)
            Direct APK download for Android devices.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
